HOME_FIXES_B64
          base64 -d /tmp/home-fixes.tgz.b64 > /tmp/home-fixes.tgz
          tar -xzf /tmp/home-fixes.tgz

      - name: Validate updated home
        shell: bash
        run: |
          node --check script.js
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('<h1') == 1, 'Expected exactly one H1'
          assert 'A GNAVIDA também mostra presença' not in html, 'Instagram section still present'
          assert html.count('class="faq-item"') == 6, 'Expected six FAQ items'
          assert 'A NR-1 já está valendo' in html, 'NR-1 banner missing'
          assert 'final-quote-form' in html, 'Final quote form missing'
          assert 'INSERIR' not in html, 'Placeholder still present'
          PY

      - name: Commit home fixes
        shell: bash
        run: |
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply GNAVIDA home conversion fixes"
          git push
