name: Remove Travessoes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-travessoes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-copy:
    name: Remove long dash characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Replace long dashes in site files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          extensions = {'.html', '.css', '.js', '.md', '.ts', '.tsx', '.json', '.xml', '.txt'}
          skip_dirs = {'.git', 'node_modules', '.next'}
          em_dash = chr(0x2014)
          en_dash = chr(0x2013)
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if path.as_posix() == '.github/workflows/remove-travessoes.yml':
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix not in extensions:
                  continue

              text = path.read_text(encoding='utf-8')
              updated = text.replace(f' {em_dash} ', ' - ').replace(em_dash, '-')
              updated = updated.replace(f' {en_dash} ', ' a ').replace(en_dash, ' a ')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(changed) if changed else 'No long dashes found.')
          PY

      - name: Validate no long dashes remain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          em_dash = chr(0x2014)
          en_dash = chr(0x2013)
          skip_dirs = {'.git', 'node_modules', '.next'}
          allowed = {'.github/workflows/remove-travessoes.yml'}
          hits = []

          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if path.as_posix() in allowed:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if em_dash in text or en_dash in text:
                  hits.append(str(path))

          if hits:
              print('\n'.join(hits))
              raise SystemExit(1)
          PY

      - name: Commit cleaned copy
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove long dashes from site copy"
          git push
